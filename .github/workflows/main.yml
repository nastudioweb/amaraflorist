name: CI/CD Workflow for Amara Florist

on:
  push:
    branches: [ "main", "master" ]
  pull_request:
    branches: [ "main", "master" ]

jobs:
  build-and-test:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout repository
      uses: actions/checkout@v4

    # Langkah 2: Menyiapkan lingkungan Node.js (Tanpa Cache untuk menghindari error lockfile)
    - name: Setup Node.js environment
      uses: actions/setup-node@v4
      with:
        node-version: '20'

    # Langkah 3: Menginstal semua dependencies menggunakan npm install
    - name: Install dependencies
      run: npm install --legacy-peer-deps

    # Langkah 4: Menjalankan proses build
    - name: Build project
      run: npm run build --if-present

    # Langkah 5: Menjalankan pengujian otomatis
    - name: Run tests
      run: npm test --if-present
