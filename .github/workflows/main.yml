name: CI/CD Workflow for Amara Florist

# Memicu alur kerja (workflow) setiap ada push atau pull request ke branch utama
on:
  push:
    branches: [ "main", "master" ]
  pull_request:
    branches: [ "main", "master" ]

jobs:
  build-and-test:
    runs-on: ubuntu-latest

    steps:
    # Langkah 1: Mengambil kode dari repositori GitHub
    - name: Checkout repository
      uses: actions/checkout@v4

    # Langkah 2: Menyiapkan lingkungan Node.js
    - name: Setup Node.js environment
      uses: actions/setup-node@v4
      with:
        node-version: '20' # Anda bisa mengubah versi ini sesuai kebutuhan proyek
        cache: 'npm'       # Mengaktifkan cache untuk mempercepat instalasi dependencies

    # Langkah 3: Menginstal semua dependencies yang ada di package.json
    - name: Install dependencies
      run: npm ci

    # Langkah 4: Menjalankan proses build (jika ada, misal React, Vue, Next.js)
    - name: Build project
      run: npm run build --if-present

    # Langkah 5: Menjalankan pengujian otomatis (automated testing)
    - name: Run tests
      run: npm test --if-present
